<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0E0F14;--bg2:#16181F;--bg3:#1E2029;
  --text:#F0F1F5;--muted:#6B7080;--border:rgba(255,255,255,0.08);
  --gold-l:#F9E07A;--gold-m:#E8B820;--gold-d:#A07A00;
  --sil-l:#E8EAF0;--sil-m:#9DA3B4;--sil-d:#4A5070;
  --green:#4ADE80;--red:#F87171;--orange:#FF8C42;
}
body.light{--bg:#F4F1EA;--bg2:#ECEAE3;--bg3:#E2DFD8;--text:#1A1A1A;--muted:#8A8070;--border:rgba(0,0,0,0.1)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem 3rem;transition:background .3s,color .3s}
.topbar{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
h1{font-family:'DM Mono',monospace;font-size:.95rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.top-btns{display:flex;gap:8px}
.icon-btn{background:var(--bg2);border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .15s}
.icon-btn:hover{background:var(--bg3)}
/* wallet */
.wallet{width:100%;max-width:460px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:1.2rem;position:relative;overflow:hidden}
.wallet::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,rgba(232,184,32,.06),transparent 70%);pointer-events:none}
.wallet-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.wallet-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.wallet-bal{font-family:'DM Mono',monospace;font-size:2rem;font-weight:500;color:var(--gold-l);line-height:1;transition:color .3s}
.wallet-bal.up{color:var(--green)}.wallet-bal.down{color:var(--red)}
.wallet-sub{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);margin-top:3px}
.wallet-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.badge.green{color:var(--green);border-color:rgba(74,222,128,.25);background:rgba(74,222,128,.06)}
.badge.red{color:var(--red);border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.06)}
.badge.gold{color:var(--gold-l);border-color:rgba(232,184,32,.3);background:rgba(232,184,32,.07)}
.delta{position:fixed;font-family:'DM Mono',monospace;font-size:1.4rem;font-weight:500;pointer-events:none;z-index:1000;opacity:0}
.delta.show{animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
/* wager */
.wager-wrap{width:100%;max-width:460px;margin-bottom:1rem}
.wager-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.wager-label span{color:var(--gold-l)}
.wager-slider{width:100%;accent-color:var(--gold-m);cursor:pointer;margin-bottom:10px}
.wager-presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font-family:'DM Mono',monospace;font-size:.7rem;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.06em}
.preset:hover,.preset.on{border-color:var(--gold-m);color:var(--gold-l);background:rgba(232,184,32,.08)}
/* skin selector */
.skin-bar{display:flex;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap;justify-content:center}
.skin-btn{padding:5px 14px;border-radius:20px;font-size:.72rem;font-family:'DM Mono',monospace;letter-spacing:.1em;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--muted);transition:all .15s}
.skin-btn.on{color:var(--text);border-color:var(--gold-m)}
/* coin */
.scene{width:220px;height:220px;perspective:900px;cursor:pointer;margin-bottom:1rem}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.tails{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;border-radius:50%}
/* result */
.result{font-family:'DM Mono',monospace;font-size:clamp(1.6rem,5vw,2.2rem);font-weight:500;letter-spacing:.04em;min-height:2.8rem;text-align:center;transition:opacity .15s}
.result.h-txt{color:var(--gold-l)}.result.t-txt{color:var(--sil-l)}.result.idle{color:var(--muted);font-size:.95rem;letter-spacing:.15em}
.streak{font-size:.76rem;color:var(--muted);letter-spacing:.1em;min-height:1.2rem;text-align:center;margin-bottom:.8rem;font-family:'DM Mono',monospace}
.streak.hot{color:var(--orange)}
/* bets */
.bet-row{display:flex;gap:10px;margin-bottom:.5rem;width:100%;max-width:460px}
.bet-btn{flex:1;padding:11px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);font-family:'DM Mono',monospace;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px}
.bet-btn:hover{border-color:var(--gold-m);color:var(--text)}
.bet-btn.sh{border-color:var(--gold-m);color:var(--gold-l);background:rgba(232,184,32,.1)}
.bet-btn.st{border-color:var(--sil-m);color:var(--sil-l);background:rgba(157,163,180,.1)}
.bet-payout{font-size:.62rem;color:var(--muted);letter-spacing:.06em}
.bet-btn.sh .bet-payout,.bet-btn.st .bet-payout{color:inherit;opacity:.7}
/* action row */
.action-row{display:flex;gap:10px;align-items:center;margin-bottom:1.4rem;width:100%;max-width:460px;position:relative}
.flip-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
.orb-ring{position:absolute;inset:-14px;border-radius:50%;pointer-events:none;animation:spinRing 4s linear infinite;opacity:.55}
.orb-ring.r2{inset:-22px;animation-duration:6s;animation-direction:reverse;opacity:.35}
.orb{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold-m);box-shadow:0 0 6px var(--gold-m)}
.orb.orb2{background:#60A5FA;box-shadow:0 0 6px #60A5FA}
.orb.orb3{background:var(--green);box-shadow:0 0 6px var(--green)}
@keyframes spinRing{to{transform:rotate(360deg)}}
.btn-glow{position:absolute;inset:0;border-radius:10px;background:var(--gold-m);filter:blur(12px);opacity:.18;animation:pulseGlow 2s ease-in-out infinite;pointer-events:none}
@keyframes pulseGlow{0%,100%{opacity:.12;transform:scale(.95)}50%{opacity:.28;transform:scale(1.05)}}
.ripple{position:absolute;border-radius:50%;background:rgba(232,184,32,.4);transform:scale(0);animation:rippleOut .6s ease-out forwards;pointer-events:none}
@keyframes rippleOut{to{transform:scale(4);opacity:0}}
.btn-flip{background:var(--gold-m);color:#1A1200;border:none;border-radius:10px;padding:14px 0;width:100%;font-family:'DM Mono',monospace;font-size:.85rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;transition:background .15s,transform .1s,opacity .15s;z-index:1}
.btn-flip:hover{background:var(--gold-l)}.btn-flip:active{transform:scale(.97)}.btn-flip:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-sec{background:none;border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--muted);font-family:'DM Mono',monospace;font-size:.75rem;letter-spacing:.1em;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sec:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
/* stats */
.stats{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;width:100%;max-width:460px;margin-bottom:.7rem}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.stat-num{font-family:'DM Mono',monospace;font-size:1.7rem;font-weight:500;line-height:1;margin-bottom:3px}
.stat.hs .stat-num{color:var(--gold-l)}.stat.ts .stat-num{color:var(--sil-l)}
.stat-label{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-family:'DM Mono',monospace}
.wr{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:.7rem;letter-spacing:.08em;min-height:1rem}
.bar-wrap{width:100%;max-width:460px;height:4px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-m),var(--gold-l));border-radius:3px;transition:width .5s ease;width:50%}
/* achievements */
.ach-wrap{width:100%;max-width:460px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem}
.ach-head{padding:9px 16px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.ach-head:hover{color:var(--text)}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.ach-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;transition:all .3s}
.ach-card.unlocked{border-color:rgba(232,184,32,.4);background:rgba(232,184,32,.06)}
.ach-icon{font-size:22px;filter:grayscale(1);opacity:.3;transition:all .3s;flex-shrink:0}
.ach-card.unlocked .ach-icon{filter:none;opacity:1}
.ach-name{font-family:'DM Mono',monospace;font-size:.68rem;font-weight:500;color:var(--muted);letter-spacing:.04em;margin-bottom:2px}
.ach-card.unlocked .ach-name{color:var(--gold-l)}
.ach-desc{font-size:.6rem;color:var(--muted);letter-spacing:.03em}
.ach-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg2);border:1px solid rgba(232,184,32,.5);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:12px;font-family:'DM Mono',monospace;z-index:3000;transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.ach-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.ach-toast-icon{font-size:24px}
.ach-toast-title{font-size:.75rem;font-weight:500;color:var(--gold-l)}
.ach-toast-desc{font-size:.65rem;color:var(--muted)}
/* history */
.hist-wrap{width:100%;max-width:460px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:.8rem}
.hist-head{padding:9px 16px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.hist-list{max-height:145px;overflow-y:auto;padding:5px 0}
.hist-list::-webkit-scrollbar{width:4px}
.hist-list::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
.hist-item{display:flex;align-items:center;gap:8px;padding:5px 14px;font-family:'DM Mono',monospace;font-size:.76rem}
.hdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hdot.h{background:var(--gold-m)}.hdot.t{background:var(--sil-m)}
.hnum{color:var(--muted);font-size:.66rem;min-width:24px}.hlbl{flex:1}
.hlbl.h{color:var(--gold-l)}.hlbl.t{color:var(--sil-l)}
.hchg{font-size:.68rem;min-width:60px;text-align:right}
.hchg.w{color:var(--green)}.hchg.l{color:var(--red)}.hchg.nb{color:var(--muted)}
.htime{color:var(--muted);font-size:.64rem;min-width:50px;text-align:right}
.hint{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);letter-spacing:.1em;margin-top:.4rem;text-align:center}
.broke-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2000;align-items:center;justify-content:center}
.broke-overlay.show{display:flex}
.broke-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:32px 40px;text-align:center;max-width:300px}
.broke-box h2{font-family:'DM Mono',monospace;font-size:1.2rem;font-weight:500;margin-bottom:8px}
.broke-box p{font-size:.85rem;color:var(--muted);margin-bottom:20px;line-height:1.6}
.broke-btn{background:var(--gold-m);color:#1A1200;border:none;border-radius:10px;padding:12px 32px;font-family:'DM Mono',monospace;font-size:.8rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.broke-btn:hover{background:var(--gold-l)}
#cc{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:999}
</style>
</head>
<body>
<canvas id="cc"></canvas>
<div class="broke-overlay" id="brokeOverlay">
  <div class="broke-box">
    <h2>💸 Broke!</h2>
    <p>You ran out of coins. Everyone gets a second chance.</p>
    <button class="broke-btn" onclick="rebuy()">Take a loan (+500 🪙)</button>
  </div>
</div>
<div class="delta" id="delta"></div>
<div class="ach-toast" id="achToast">
  <div class="ach-toast-icon" id="achToastIcon"></div>
  <div>
    <div class="ach-toast-title" id="achToastTitle"></div>
    <div class="ach-toast-desc"  id="achToastDesc"></div>
  </div>
</div>

<div class="topbar">
  <h1>Coin Flip</h1>
  <div class="top-btns">
    <button class="icon-btn" id="sndBtn" onclick="toggleSound()">🔊</button>
    <button class="icon-btn" id="thmBtn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="wallet">
  <div class="wallet-top">
    <div>
      <div class="wallet-label">balance</div>
      <div class="wallet-bal" id="walBal">1,000 🪙</div>
      <div class="wallet-sub" id="walSub">starting balance</div>
    </div>
    <div class="wallet-badges" id="walBadges"></div>
  </div>
  <canvas id="miniChart" height="32" style="width:100%;height:32px;opacity:.6"></canvas>
</div>

<div class="wager-wrap">
  <div class="wager-label"><span>wager amount</span><span id="wagerVal">50 🪙</span></div>
  <input type="range" class="wager-slider" id="wagerSlider" min="10" max="500" step="10" value="50" oninput="onSlider(this.value)">
  <div class="wager-presets">
    <button class="preset" onclick="setWager(10)">10</button>
    <button class="preset" onclick="setWager(25)">25</button>
    <button class="preset" onclick="setWager(50)">50</button>
    <button class="preset" onclick="setWager(100)">100</button>
    <button class="preset" onclick="setWager(250)">250</button>
    <button class="preset" onclick="setWagerHalf()">½</button>
    <button class="preset" onclick="setWagerAll()">All In</button>
  </div>
</div>

<div class="skin-bar">
  <button class="skin-btn on" onclick="setSkin('classic',this)">⚜️ Classic</button>
  <button class="skin-btn"   onclick="setSkin('copper',this)">🪙 Copper</button>
  <button class="skin-btn"   onclick="setSkin('bitcoin',this)">₿ Bitcoin</button>
  <button class="skin-btn"   onclick="setSkin('ancient',this)">🏺 Ancient</button>
</div>

<div class="scene" id="scene" onclick="flip()" role="button" aria-label="Flip coin" tabindex="0">
  <div class="coin" id="coin">
    <div class="face heads" id="faceH"></div>
    <div class="face tails" id="faceT"></div>
  </div>
</div>

<div class="result idle" id="res">pick a side &amp; flip</div>
<div class="streak" id="stk"></div>

<div class="bet-row">
  <button class="bet-btn" id="bH" onclick="setBet('h')">
    <span id="bHLabel">Heads</span>
    <span class="bet-payout" id="bHPayout">win +75 🪙</span>
  </button>
  <button class="bet-btn" id="bT" onclick="setBet('t')">
    <span id="bTLabel">Tails</span>
    <span class="bet-payout" id="bTPayout">win +75 🪙</span>
  </button>
</div>

<div class="action-row">
  <div class="flip-wrap" id="flipWrap">
    <div class="btn-glow" id="btnGlow"></div>
    <div class="orb-ring" id="orbRing1">
      <div class="orb" style="top:-3px;left:50%;margin-left:-3px"></div>
      <div class="orb orb2" style="bottom:-3px;left:50%;margin-left:-3px"></div>
      <div class="orb orb3" style="top:50%;right:-3px;margin-top:-3px"></div>
    </div>
    <div class="orb-ring r2" id="orbRing2">
      <div class="orb orb2" style="top:-3px;left:25%"></div>
      <div class="orb orb3" style="bottom:-3px;right:25%"></div>
    </div>
    <button class="btn-flip" id="flipBtn" onclick="flipClick(event)">Flip</button>
  </div>
  <button class="btn-sec" onclick="resetAll()">Reset</button>
</div>

<div class="stats">
  <div class="stat hs"><div class="stat-num" id="hN">0</div><div class="stat-label">Heads</div></div>
  <div class="stat"><div class="stat-num" id="tot">0</div><div class="stat-label">Total</div></div>
  <div class="stat ts"><div class="stat-num" id="tN">0</div><div class="stat-label">Tails</div></div>
</div>
<div class="wr" id="wr"></div>
<div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>

<div class="ach-wrap">
  <div class="ach-head" onclick="toggleAch()">
    <span>Achievements</span><span id="achProgress">0 / 12</span>
  </div>
  <div id="achGrid" class="ach-grid"></div>
</div>

<div class="hist-wrap">
  <div class="hist-head"><span>Flip history</span><span id="hCnt">0 flips</span></div>
  <div class="hist-list" id="hList"><div style="padding:16px;text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:.73rem;letter-spacing:.1em">no flips yet</div></div>
</div>
<div class="hint">space/enter = flip &nbsp;·&nbsp; H/T = bet &nbsp;·&nbsp; R = reset</div>

<script>
// ── SVG coin faces ─────────────────────────────────────────────────────────

function rimDents(n,r,fill,op){
  let s='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const x=(100+Math.cos(a)*r).toFixed(1);const y=(100+Math.sin(a)*r).toFixed(1);s+=`<ellipse cx="${x}" cy="${y}" rx="4" ry="2.2" fill="${fill}" opacity="${op}" transform="rotate(${(i/n*360).toFixed(0)} ${x} ${y})"/>`}return s;
}
function rimTicks(n,r1,r2,stroke,sw,op){
  let s='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const x1=(100+Math.cos(a)*r1).toFixed(1);const y1=(100+Math.sin(a)*r1).toFixed(1);const x2=(100+Math.cos(a)*r2).toFixed(1);const y2=(100+Math.sin(a)*r2).toFixed(1);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`}return s;
}

const FACES={
  classic:{
    h:`<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs><radialGradient id="cgh" cx="42%" cy="38%" r="62%"><stop offset="0%" stop-color="#FFFBE0"/><stop offset="22%" stop-color="#F9E07A"/><stop offset="58%" stop-color="#D4940A"/><stop offset="82%" stop-color="#9A6600"/><stop offset="100%" stop-color="#5C3A00"/></radialGradient></defs>
<circle cx="100" cy="100" r="100" fill="url(#cgh)"/>
<circle cx="100" cy="100" r="91" fill="none" stroke="#C48A00" stroke-width="2.5"/>
<circle cx="100" cy="100" r="84" fill="none" stroke="rgba(255,240,120,.3)" stroke-width="1"/>
<circle cx="100" cy="100" r="63" fill="none" stroke="#C48A00" stroke-width="1" stroke-dasharray="2 4"/>
${rimDents(16,87,'#9A6600','0.7')}
<path d="M88,63 C88,58 94,52 100,50 C106,52 112,58 112,63" fill="none" stroke="#8A5800" stroke-width="1.5" opacity=".55"/>
<ellipse cx="100" cy="91" rx="19" ry="23" fill="#B07800" opacity=".45"/>
<path d="M81,92 Q81,68 100,64 Q119,68 119,92 Q119,106 100,111 Q81,106 81,92Z" fill="#A06800" opacity=".5"/>
<path d="M86,108 Q100,120 114,108 Q108,124 100,126 Q92,124 86,108Z" fill="#7A4800" opacity=".45"/>
<circle cx="93" cy="86" r="2.5" fill="#5A3000" opacity=".55"/>
<path d="M86,63 L90,53 L96,61 L100,48 L104,61 L110,53 L114,63Z" fill="#C49000" opacity=".65" stroke="#A07000" stroke-width=".8"/>

// ── Constants
const START_BAL=1000, WIN_MULT=1.5, LOSE_MULT=0.75, STREAK_BONUS=0.25;

// ── Achievements
const ACHIEVEMENTS=[
  {id:'first',    icon:'🎯',name:'First Flip',      desc:'Flip for the first time',          check:()=>flipN>=1},
  {id:'streak3',  icon:'🔥',name:'Hat Trick',        desc:'3 in a row',                       check:()=>streak>=3},
  {id:'streak5',  icon:'🌊',name:'On Fire',           desc:'5 in a row',                       check:()=>streak>=5},
  {id:'streak10', icon:'⚡',name:'Unstoppable',       desc:'10 in a row',                      check:()=>streak>=10},
  {id:'flip10',   icon:'🪙',name:'Getting Warmed Up', desc:'10 total flips',                   check:()=>flipN>=10},
  {id:'flip50',   icon:'🎲',name:'Flip Addict',       desc:'50 total flips',                   check:()=>flipN>=50},
  {id:'flip100',  icon:'💯',name:'Centurion',         desc:'100 total flips',                  check:()=>flipN>=100},
  {id:'rich',     icon:'🤑',name:'Getting Rich',      desc:'Reach 2,000 🪙',                   check:()=>bal>=2000},
  {id:'filthy',   icon:'💰',name:'Filthy Rich',       desc:'Reach 5,000 🪙',                   check:()=>bal>=5000},
  {id:'win5',     icon:'🏆',name:'High Roller',       desc:'5 bets won in a row',              check:()=>betWinStreak>=5},
  {id:'allIn',    icon:'🎰',name:'All In',            desc:'Bet your entire balance',          check:()=>wentAllIn},
  {id:'comeback', icon:'💪',name:'Comeback Kid',      desc:'Recover from under 100 to 500+',  check:()=>madeComeback},
];
let unlockedAch=new Set(),toastQueue=[],toastBusy=false;

function checkAchievements(){ACHIEVEMENTS.forEach(a=>{if(!unlockedAch.has(a.id)&&a.check()){unlockedAch.add(a.id);showAchToast(a)}});renderAch()}
function showAchToast(a){toastQueue.push(a);if(!toastBusy)nextToast()}
function nextToast(){if(!toastQueue.length){toastBusy=false;return}toastBusy=true;const a=toastQueue.shift();const t=document.getElementById('achToast');document.getElementById('achToastIcon').textContent=a.icon;document.getElementById('achToastTitle').textContent='Achievement: '+a.name;document.getElementById('achToastDesc').textContent=a.desc;t.classList.add('show');playAch();setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,400)},2800)}
function renderAch(){const g=document.getElementById('achGrid');g.innerHTML=ACHIEVEMENTS.map(a=>{const on=unlockedAch.has(a.id);return`<div class="ach-card${on?' unlocked':''}"><div class="ach-icon">${a.icon}</div><div><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div></div>`}).join('');document.getElementById('achProgress').textContent=unlockedAch.size+' / '+ACHIEVEMENTS.length}
function toggleAch(){const g=document.getElementById('achGrid');g.style.display=g.style.display==='none'?'grid':'none'}

// ── State
let bal=START_BAL,peak=START_BAL,wager=50;
let betChoice=null,busy=false,soundOn=true,light=false,skin='classic';
let h=0,t=0,streak=0,last=null,flipN=0;
let bW=0,bL=0,totalWon=0,totalLost=0;
let betWinStreak=0,wentAllIn=false,madeComeback=false,wasLow=false;
const log=[],balHistory=[START_BAL];

// ── Elements
const coinEl=document.getElementById('coin'),resEl=document.getElementById('res'),stkEl=document.getElementById('stk');
const flipBtn=document.getElementById('flipBtn'),barEl=document.getElementById('bar');
const bHBtn=document.getElementById('bH'),bTBtn=document.getElementById('bT');
const hList=document.getElementById('hList'),hCnt=document.getElementById('hCnt'),wrEl=document.getElementById('wr');
const walBal=document.getElementById('walBal'),walSub=document.getElementById('walSub'),walBadges=document.getElementById('walBadges');
const slider=document.getElementById('wagerSlider');

// ── Apply skin
const SKIN_LABELS={classic:['👑 Heads','⚡ Tails'],copper:['🪙 Heads','🏛️ Tails'],bitcoin:['₿ Heads','🔶 Tails'],ancient:['🏺 Heads','🦉 Tails']};
function applySkin(name){
  document.getElementById('faceH').innerHTML=FACES[name].h;
  document.getElementById('faceT').innerHTML=FACES[name].t;
  document.getElementById('bHLabel').textContent=SKIN_LABELS[name][0];
  document.getElementById('bTLabel').textContent=SKIN_LABELS[name][1];
  coinEl.style.transform='';
}
applySkin('classic');

// ── Audio
const actx=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,type,vol,t,d){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+d);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+d+.01)}
function playFlip(){if(!soundOn)return;for(let i=0;i<7;i++)beep(900+i*60,'sine',.12,i*.09,.07)}
function playLand(isH){if(!soundOn)return;beep(isH?660:440,'triangle',.2,0,.08);beep(isH?880:330,'triangle',.15,.1,.12)}
function playWin(){if(!soundOn)return;[523,659,784,1047].forEach((f,i)=>beep(f,'sine',.15,i*.1,.18))}
function playBigWin(){if(!soundOn)return;[523,659,784,1047,1319].forEach((f,i)=>beep(f,'sine',.18,i*.08,.2))}
function playLose(){if(!soundOn)return;[392,349,294].forEach((f,i)=>beep(f,'sawtooth',.1,i*.12,.18))}
function playAch(){if(!soundOn)return;[659,784,880,1047].forEach((f,i)=>beep(f,'sine',.12,i*.07,.2))}

// ── Confetti
const cc=document.getElementById('cc'),cx=cc.getContext('2d');let parts=[];
function confetti(big){cc.width=innerWidth;cc.height=innerHeight;const n=big?180:100;for(let i=0;i<n;i++)parts.push({x:Math.random()*cc.width,y:-20-Math.random()*80,w:7+Math.random()*9,h:4+Math.random()*5,c:['#E8B820','#F9E07A','#9DA3B4','#FF8C42','#4ADE80','#60A5FA','#F87171'][Math.floor(Math.random()*7)],vx:(Math.random()-.5)*5,vy:3+Math.random()*5,r:Math.random()*360,vr:(Math.random()-.5)*9,life:1});(function draw(){cx.clearRect(0,0,cc.width,cc.height);parts=parts.filter(p=>p.life>.01);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.013;cx.save();cx.globalAlpha=p.life;cx.translate(p.x,p.y);cx.rotate(p.r*Math.PI/180);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});if(parts.length)requestAnimationFrame(draw)})()}

// ── Mini chart
function drawChart(){const cv=document.getElementById('miniChart'),ctx=cv.getContext('2d');cv.width=cv.offsetWidth*2;cv.height=64;ctx.clearRect(0,0,cv.width,cv.height);if(balHistory.length<2)return;const mn=Math.min(...balHistory),mx=Math.max(...balHistory),range=Math.max(mx-mn,1),W=cv.width,H=cv.height,pad=4;const pts=balHistory.map((v,i)=>({x:pad+i/(balHistory.length-1)*(W-pad*2),y:pad+(1-(v-mn)/range)*(H-pad*2)}));const grad=ctx.createLinearGradient(0,0,0,H);const rising=balHistory[balHistory.length-1]>=balHistory[0];grad.addColorStop(0,rising?'rgba(74,222,128,.35)':'rgba(248,113,113,.35)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,H);ctx.lineTo(pts[0].x,H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.strokeStyle=rising?'#4ADE80':'#F87171';ctx.lineWidth=2;ctx.stroke()}

// ── Delta popup
function showDelta(amount,el){const d=document.getElementById('delta');d.textContent=(amount>0?'+':'')+amount+'🪙';d.style.color=amount>0?'#4ADE80':'#F87171';const r=el.getBoundingClientRect();d.style.left=(r.left+r.width/2-30)+'px';d.style.top=(r.top-10)+'px';d.classList.remove('show');void d.offsetWidth;d.classList.add('show')}

// ── Button glow by streak
function updateBtnGlow(){
  const r1=document.getElementById('orbRing1'),r2=document.getElementById('orbRing2');
  const g=document.getElementById('btnGlow');
  if(streak>=5){r1.style.opacity='0.9';r2.style.opacity='0.7';g.style.background='#F87171';g.style.animationDuration='.8s';}
  else if(streak>=3){r1.style.opacity='0.75';r2.style.opacity='0.5';g.style.background='#FF8C42';g.style.animationDuration='1.2s';}
  else{r1.style.opacity='0.55';r2.style.opacity='0.35';g.style.background='var(--gold-m)';g.style.animationDuration='2s';}
}

// ── Ripple
function flipClick(e){const r=flipBtn.getBoundingClientRect(),rip=document.createElement('div');rip.className='ripple';const sz=Math.max(flipBtn.offsetWidth,flipBtn.offsetHeight);rip.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`;flipBtn.appendChild(rip);setTimeout(()=>rip.remove(),700);flip()}

// ── Wallet
function updateWallet(delta){
  walBal.textContent=bal.toLocaleString()+' 🪙';
  const diff=bal-START_BAL;walSub.textContent=(diff>=0?'▲ +':'▼ ')+Math.abs(diff).toLocaleString()+' from start';
  if(delta>0){walBal.className='wallet-bal up';setTimeout(()=>walBal.className='wallet-bal',600)}
  else if(delta<0){walBal.className='wallet-bal down';setTimeout(()=>walBal.className='wallet-bal',600)}
  if(bal>peak)peak=bal;
  const badges=[];
  if(peak>=2000)badges.push({t:'🏆 Peak: '+peak.toLocaleString(),c:'gold'});
  if(bL>bW&&bL>=3)badges.push({t:'❄️ Cold streak',c:'red'});
  if(betWinStreak>=3)badges.push({t:'🔥 '+betWinStreak+'W',c:'green'});
  walBadges.innerHTML=badges.map(b=>`<span class="badge ${b.c}">${b.t}</span>`).join('');
  slider.max=Math.max(10,bal);if(wager>bal)setWager(Math.max(10,Math.floor(bal/10)*10));
  updatePayoutLabels();
}
function updatePayoutLabels(){const win=Math.round(wager*WIN_MULT),lose=Math.round(wager*LOSE_MULT);document.getElementById('bHPayout').textContent='win +'+win+' · lose -'+lose+' 🪙';document.getElementById('bTPayout').textContent='win +'+win+' · lose -'+lose+' 🪙';document.getElementById('wagerVal').textContent=wager+' 🪙'}
function setWager(v){wager=Math.max(10,Math.min(v,bal));slider.value=wager;document.querySelectorAll('.preset').forEach(b=>b.classList.remove('on'));updatePayoutLabels()}
function onSlider(v){wager=parseInt(v);document.querySelectorAll('.preset').forEach(b=>b.classList.remove('on'));updatePayoutLabels()}
function setWagerHalf(){setWager(Math.max(10,Math.floor(bal/2/10)*10))}
function setWagerAll(){wentAllIn=true;setWager(bal)}
function setBet(side){if(busy)return;betChoice=side;bHBtn.className='bet-btn'+(side==='h'?' sh':'');bTBtn.className='bet-btn'+(side==='t'?' st':'')}

// ── Animation
function animateCoin(targetY,durationMs,onDone){const start=performance.now();function frame(now){let p=(now-start)/durationMs;if(p>=1)p=1;const e=1-Math.pow(1-p,3);const sc=1+.15*Math.sin(p*Math.PI);coinEl.style.transform=`rotateY(${targetY*e}deg) scale(${sc})`;if(p<1)requestAnimationFrame(frame);else{coinEl.style.transform=`rotateY(${targetY}deg) scale(1)`;onDone()}}requestAnimationFrame(frame)}

// ── Flip
function flip(){
  if(busy)return;if(actx.state==='suspended')actx.resume();
  busy=true;flipBtn.disabled=true;
  const isH=Math.random()<.5;
  const spins=5+Math.floor(Math.random()*4);
  const finalY=spins*360+(isH?0:180);
  const dur=1400+Math.floor(Math.random()*500);
  playFlip();resEl.style.opacity='0';
  animateCoin(finalY,dur,()=>{
    coinEl.style.transform=`rotateY(${isH?0:180}deg) scale(1)`;
    if(isH)h++;else t++;
    streak=(last===(isH?'h':'t'))?streak+1:1;last=isH?'h':'t';flipN++;
    const total=h+t;
    playLand(isH);
    resEl.className='result '+(isH?'h-txt':'t-txt');resEl.textContent=isH?'Heads':'Tails';resEl.style.opacity='1';
    if(streak>=3){stkEl.className='streak hot';stkEl.textContent=streak+' '+(isH?'heads':'tails')+' in a row 🔥';if(streak%3===0)confetti(false)}
    else{stkEl.className='streak';stkEl.textContent=Math.round((isH?h:t)/total*100)+'% '+(isH?'heads':'tails')+' so far'}
    updateBtnGlow();
    let delta=0,betTag='nb';
    if(betChoice){
      const won=(isH&&betChoice==='h')||(!isH&&betChoice==='t');
      const sb=(won&&streak>=3)?Math.round(wager*STREAK_BONUS*(streak-2)):0;
      if(won){
        const profit=Math.round(wager*WIN_MULT)+sb;
        bal+=profit;delta=+profit;totalWon+=profit;bW++;betWinStreak++;
        const big=profit>=500||streak>=5;
        if(big)playBigWin();else playWin();
        if(big||streak>=5)confetti(true);else confetti(false);
        betTag='w';if(sb>0)resEl.textContent=(isH?'Heads':'Tails')+' 🔥 BONUS!';
        if(wasLow&&bal>=500){madeComeback=true;wasLow=false}
      }else{
        const loss=Math.round(wager*LOSE_MULT);
        bal=Math.max(0,bal-loss);delta=-loss;totalLost+=loss;bL++;betWinStreak=0;playLose();betTag='l';
      }
      betChoice=null;bHBtn.className='bet-btn';bTBtn.className='bet-btn';
    }else{betWinStreak=0}
    if(bal<100)wasLow=true;
    if(delta!==0)showDelta(delta,walBal);
    balHistory.push(bal);if(balHistory.length>60)balHistory.shift();
    updateWallet(delta);drawChart();
    document.getElementById('hN').textContent=h;document.getElementById('tN').textContent=t;document.getElementById('tot').textContent=total;
    barEl.style.width=(h/total*100)+'%';wrEl.textContent='heads '+Math.round(h/total*100)+'%  ·  tails '+Math.round(t/total*100)+'%';
    addLog(isH,delta,betTag);checkAchievements();
    if(bal<10)setTimeout(()=>document.getElementById('brokeOverlay').classList.add('show'),400);
    busy=false;flipBtn.disabled=false;
  });
}

function addLog(isH,delta,tag){const d=new Date();const ts=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');log.unshift({isH,n:flipN,ts,delta,tag});if(log.length>60)log.pop();renderLog()}
function renderLog(){hCnt.textContent=log.length+' flip'+(log.length!==1?'s':'');if(!log.length){hList.innerHTML='<div style="padding:16px;text-align:center;color:var(--muted);font-family:\'DM Mono\',monospace;font-size:.73rem;letter-spacing:.1em">no flips yet</div>';return}hList.innerHTML=log.map(f=>{const chg=f.tag==='nb'?'<span class="hchg nb">no bet</span>':f.tag==='w'?`<span class="hchg w">+${f.delta}🪙</span>`:`<span class="hchg l">${f.delta}🪙</span>`;return`<div class="hist-item"><div class="hdot ${f.isH?'h':'t'}"></div><span class="hnum">#${f.n}</span><span class="hlbl ${f.isH?'h':'t'}">${f.isH?SKIN_LABELS[skin][0]:SKIN_LABELS[skin][1]}</span>${chg}<span class="htime">${f.ts}</span></div>`}).join('')}

function setSkin(name,btn){document.querySelectorAll('.skin-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');skin=name;applySkin(name);renderLog()}
function rebuy(){bal+=500;balHistory.push(bal);document.getElementById('brokeOverlay').classList.remove('show');updateWallet(500);drawChart()}
function toggleSound(){soundOn=!soundOn;document.getElementById('sndBtn').textContent=soundOn?'🔊':'🔇'}
function toggleTheme(){light=!light;document.body.classList.toggle('light',light);document.getElementById('thmBtn').textContent=light?'☀️':'🌙'}
function resetAll(){if(busy)return;h=0;t=0;streak=0;last=null;flipN=0;betChoice=null;bW=0;bL=0;totalWon=0;totalLost=0;bal=START_BAL;peak=START_BAL;wager=50;betWinStreak=0;wentAllIn=false;madeComeback=false;wasLow=false;unlockedAch.clear();balHistory.length=0;balHistory.push(START_BAL);log.length=0;slider.value=50;document.getElementById('hN').textContent=0;document.getElementById('tN').textContent=0;document.getElementById('tot').textContent=0;barEl.style.width='50%';resEl.className='result idle';resEl.textContent='pick a side & flip';stkEl.className='streak';stkEl.textContent='';bHBtn.className='bet-btn';bTBtn.className='bet-btn';wrEl.textContent='';coinEl.style.transform='';walBadges.innerHTML='';document.getElementById('orbRing1').style.opacity='0.55';document.getElementById('orbRing2').style.opacity='0.35';document.getElementById('btnGlow').style.background='var(--gold-m)';updateWallet(0);drawChart();renderLog();renderAch()}

updateWallet(0);drawChart();updatePayoutLabels();renderAch();
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}if(e.key==='h'||e.key==='H')setBet('h');if(e.key==='t'||e.key==='T')setBet('t');if(e.key==='r'||e.key==='R')resetAll()});
</script>
</body>
