<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold-light: #F9E07A;
    --gold-mid:   #E8B820;
    --gold-dark:  #A07A00;
    --silver-light: #E8EAF0;
    --silver-mid:   #9DA3B4;
    --silver-dark:  #4A5070;
    --bg:    #0E0F14;
    --bg2:   #16181F;
    --bg3:   #1E2029;
    --text:  #F0F1F5;
    --muted: #6B7080;
    --border: rgba(255,255,255,0.07);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    gap: 0;
  }

  h1 {
    font-family: 'DM Mono', monospace;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3rem;
    text-align: center;
  }

  /* ── Coin ── */
  .scene {
    width: 180px;
    height: 180px;
    perspective: 700px;
    cursor: pointer;
    margin-bottom: 3rem;
  }

  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s;
  }

  .coin.spinning {
    animation: coinSpin var(--duration, 1.4s) cubic-bezier(0.33,0,0.2,1) forwards;
  }

  @keyframes coinSpin {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(var(--final-y, 900deg)); }
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    user-select: none;
  }

  .face.heads {
    background: radial-gradient(circle at 38% 35%, #FFF3A0 0%, var(--gold-light) 30%, var(--gold-mid) 65%, var(--gold-dark) 100%);
    border: 4px solid var(--gold-mid);
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.5), inset 0 -3px 8px rgba(0,0,0,0.25);
  }

  .face.tails {
    background: radial-gradient(circle at 38% 35%, #FFFFFF 0%, var(--silver-light) 30%, var(--silver-mid) 65%, var(--silver-dark) 100%);
    border: 4px solid var(--silver-mid);
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.5), inset 0 -3px 8px rgba(0,0,0,0.25);
    transform: rotateY(180deg);
  }

  .face-symbol {
    font-size: 60px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }

  .face-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dark);
    font-weight: 500;
  }

  .face.tails .face-label { color: var(--silver-dark); }

  /* outer ring */
  .face::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.35);
    pointer-events: none;
  }

  /* ── Result ── */
  .result {
    font-family: 'DM Mono', monospace;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 500;
    letter-spacing: 0.04em;
    min-height: 2.8rem;
    text-align: center;
    margin-bottom: 0.5rem;
    transition: opacity 0.2s, transform 0.2s;
  }

  .result.heads-text { color: var(--gold-light); }
  .result.tails-text { color: var(--silver-light); }
  .result.idle       { color: var(--muted); font-size: 1rem; letter-spacing: 0.15em; }

  .streak {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    min-height: 1.2rem;
    text-align: center;
    margin-bottom: 2.5rem;
    font-family: 'DM Mono', monospace;
  }

  .streak.hot { color: #FF8C42; }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 2.5rem;
  }

  .stat {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
  }

  .stat-num {
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat.heads-stat .stat-num { color: var(--gold-light); }
  .stat.total-stat .stat-num { color: var(--text); }
  .stat.tails-stat .stat-num { color: var(--silver-light); }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* bar */
  .bar-wrap {
    width: 100%;
    max-width: 340px;
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 2.5rem;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-mid), var(--gold-light));
    border-radius: 2px;
    transition: width 0.5s ease;
    width: 50%;
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-flip {
    background: var(--gold-mid);
    color: #1A1200;
    border: none;
    border-radius: 10px;
    padding: 14px 40px;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.15s;
  }

  .btn-flip:hover { background: var(--gold-light); }
  .btn-flip:active { transform: scale(0.97); }
  .btn-flip:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-reset {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-reset:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .coin.spinning { animation: none !important; }
    .bar-fill { transition: none; }
  }
</style>
</head>
<body>

<h1>Coin Flip</h1>

<div class="scene" id="scene" onclick="flip()" role="button" aria-label="Flip coin" tabindex="0">
  <div class="coin" id="coin">
    <div class="face heads">
      <div class="face-symbol">👑</div>
      <div class="face-label">Heads</div>
    </div>
    <div class="face tails">
      <div class="face-symbol">⚡</div>
      <div class="face-label">Tails</div>
    </div>
  </div>
</div>

<div class="result idle" id="result">tap to flip</div>
<div class="streak" id="streak"></div>

<div class="stats">
  <div class="stat heads-stat">
    <div class="stat-num" id="hCount">0</div>
    <div class="stat-label">Heads</div>
  </div>
  <div class="stat total-stat">
    <div class="stat-num" id="tTotal">0</div>
    <div class="stat-label">Total</div>
  </div>
  <div class="stat tails-stat">
    <div class="stat-num" id="tCount">0</div>
    <div class="stat-label">Tails</div>
  </div>
</div>

<div class="bar-wrap">
  <div class="bar-fill" id="bar"></div>
</div>

<div class="btn-row">
  <button class="btn-flip" id="flipBtn" onclick="flip()">Flip</button>
  <button class="btn-reset" onclick="reset()">Reset</button>
</div>

<script>
  let h = 0, t = 0, streak = 0, last = null, busy = false;

  const coin     = document.getElementById('coin');
  const result   = document.getElementById('result');
  const streakEl = document.getElementById('streak');
  const flipBtn  = document.getElementById('flipBtn');
  const bar      = document.getElementById('bar');
  const scene    = document.getElementById('scene');

  scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') flip(); });

  function flip() {
    if (busy) return;
    busy = true;
    flipBtn.disabled = true;

    const isHeads = Math.random() < 0.5;
    const spins   = 4 + Math.floor(Math.random() * 3); // 4–6 full rotations
    const base    = spins * 360;
    const finalY  = isHeads ? base : base + 180;
    const dur     = 1.2 + Math.random() * 0.4;

    coin.style.setProperty('--final-y', finalY + 'deg');
    coin.style.setProperty('--duration', dur + 's');

    coin.classList.remove('spinning');
    void coin.offsetWidth;
    coin.classList.add('spinning');

    result.style.opacity = '0';

    setTimeout(() => {
      // update state
      if (isHeads) h++; else t++;
      streak = (last === (isHeads ? 'h' : 't')) ? streak + 1 : 1;
      last = isHeads ? 'h' : 't';

      const total = h + t;

      // result label
      result.className = 'result ' + (isHeads ? 'heads-text' : 'tails-text');
      result.textContent = isHeads ? 'Heads' : 'Tails';
      result.style.opacity = '1';

      // streak
      if (streak >= 3) {
        streakEl.className = 'streak hot';
        streakEl.textContent = streak + ' ' + (isHeads ? 'heads' : 'tails') + ' in a row 🔥';
      } else {
        streakEl.className = 'streak';
        const pct = Math.round((isHeads ? h : t) / total * 100);
        streakEl.textContent = pct + '% ' + (isHeads ? 'heads' : 'tails') + ' so far';
      }

      // stats
      document.getElementById('hCount').textContent  = h;
      document.getElementById('tCount').textContent  = t;
      document.getElementById('tTotal').textContent  = total;

      // bar = heads %
      bar.style.width = (total > 0 ? (h / total * 100) : 50) + '%';

      busy = false;
      flipBtn.disabled = false;
    }, dur * 1000);
  }

  function reset() {
    if (busy) return;
    h = 0; t = 0; streak = 0; last = null;
    document.getElementById('hCount').textContent  = 0;
    document.getElementById('tCount').textContent  = 0;
    document.getElementById('tTotal').textContent  = 0;
    bar.style.width = '50%';
    result.className = 'result idle';
    result.textContent = 'tap to flip';
    streakEl.className = 'streak';
    streakEl.textContent = '';
    coin.classList.remove('spinning');
    coin.style.removeProperty('--final-y');
  }
</script>
</body>
</html>
